services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  flowforge:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LLM_PROVIDER: heuristic
    depends_on:
      - redis
